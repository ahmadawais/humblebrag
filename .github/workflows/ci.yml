name: ci

# Pull requests only. Pushes to main build and release in release.yml.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: ./target/release/humblebrag --version
      - name: npm package builds
        run: |
          cd target/release
          for k in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64.exe; do cp humblebrag humblebrag-$k; done
          sha256sum humblebrag-* > SHA256SUMS
          cd ../..
          node scripts/npm-build.mjs --version 0.0.0 --sums target/release/SHA256SUMS --out /tmp/npm-dist
