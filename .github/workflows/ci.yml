name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - run: ./target/release/humblebrag --version
      - run: node scripts/npm-build.mjs --version 0.0.0 --bins target/release --out /tmp/npm-dist
