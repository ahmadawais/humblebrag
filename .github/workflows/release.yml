name: release

# Push a tag like v0.1.0 (matching Cargo.toml) to build 5 binaries and attach
# them to a GitHub release. npm publishing happens locally: scripts/release.sh.
# No npm token is stored in this repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { key: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { key: darwin-x64, target: x86_64-apple-darwin, os: macos-latest }
          - { key: linux-x64, target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { key: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { key: win32-x64, target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          echo "CC_$(echo ${{ matrix.target }} | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          ext=""; [ "${{ matrix.key }}" = win32-x64 ] && ext=".exe"
          ./target/${{ matrix.target }}/release/humblebrag$ext --version
          mkdir out && cp target/${{ matrix.target }}/release/humblebrag$ext out/humblebrag-${{ matrix.key }}$ext
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.key }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bins
          pattern: bin-*
          merge-multiple: true
      - run: cd bins && sha256sum humblebrag-* > SHA256SUMS && cat SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" bins/* -R "$GITHUB_REPOSITORY" --generate-notes
